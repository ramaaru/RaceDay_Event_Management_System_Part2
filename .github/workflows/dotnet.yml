name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore RaceDay_PROG6212_Part2/RaceDay.sln

    - name: Build solution
      run: dotnet build --no-restore -c Release RaceDay_PROG6212_Part2/RaceDay.sln

    - name: Run tests
      run: dotnet test --no-build -c Release RaceDay_PROG6212_Part2/RaceDay.sln --verbosity normal
